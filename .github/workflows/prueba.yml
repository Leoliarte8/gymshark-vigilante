name: Prueba rapida

on:
  workflow_dispatch:

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests tzdata
      - name: Consultar productos una vez
        env:
          DURACION_SEGUNDOS: "5"
        run: python nube.py
